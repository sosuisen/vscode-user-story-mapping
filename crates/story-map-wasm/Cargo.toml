[package]
name = "story-map-wasm"
version = "0.1.0"
description = "WebAssembly bindings of storymap for the VS Code extension"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
storymap = { version = "0.2.1", features = ["html"] }
wasm-bindgen = "0.2.130"
