[package]
name = "story-map-core"
version = "0.1.0"
description = "Turn a Markdown outline into a user story map, and render the map as HTML"
edition.workspace = true
license.workspace = true

[features]
default = ["html"]
# Render the map as HTML. An app that draws the map with its own UI can turn this off
html = []

[dependencies]
comrak = { version = "0.59.0", default-features = false }
regex = "1.13.1"
